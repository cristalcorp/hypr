# hypridle: idle actions (OLED care)
# Doc: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

# Hide waybar after 30 s without keyboard/mouse input, show it again on any input.
# Waybar maps SIGUSR1 -> hide, SIGUSR2 -> show (see ~/.config/waybar/config).
listener {
    timeout = 30
    on-timeout = pkill -SIGUSR1 -x waybar
    on-resume = pkill -SIGUSR2 -x waybar
}
