# hypridle: idle actions (OLED care)
# Doc: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

# Hide waybar after 30 s without keyboard/mouse input, show it again on any input.
# Waybar maps SIGUSR1 -> hide, SIGUSR2 -> show (see ~/.config/waybar/config).
listener {
    timeout = 30
    on-timeout = pkill -SIGUSR1 -x waybar
    on-resume = ~/.config/waybar/scripts/bar-color.sh show   # new random colors, then show
}

# Turn the screen off after 10 min idle, back on at any input (OLED care).
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
